  load_video
  insmod gfxterm
  set locale_dir=$prefix/locale
  set lang=en_US
  insmod gettext
fi
terminal_output gfxterm
insmod part_msdos
insmod ext2
set root='hd0,msdos1'
if [ x$feature_platform_search_hint = xy ]; then
  search --no-floppy --fs-uuid --set=root --hint-bios=hd0,msdos1 --hint-efi=hd0,msdos1 --hint-baremetal=ahci0,msdos1  d28f9adf-16f0-4a19-9b08-4f5bead6a937
else
  search --no-floppy --fs-uuid --set=root d28f9adf-16f0-4a19-9b08-4f5bead6a937
fi
insmod gfxmenu
loadfont ($root)/boot/grub/themes/EarthandMoon/retro_gaming_regular_22.pf2
loadfont ($root)/boot/grub/themes/EarthandMoon/terminus_regular_14.pf2
insmod jpeg
insmod png
set theme=($root)/boot/grub/themes/EarthandMoon/theme.txt
export theme
if [ "${recordfail}" = 1 ] ; then
  set timeout=30
else
  if [ x$feature_timeout_style = xy ] ; then
    set timeout_style=hidden
    set timeout=0
  # Fallback hidden-timeout code in case the timeout_style feature is
  # unavailable.
  elif sleep --interruptible 0 ; then
    set timeout=0
  fi
fi
